name: Neural Nova - Experimental App Builds

on:
  push:
    branches:
      - experimental/neural-nova
    paths:
      - "app/**"
      - "neural-nova/**"
      - ".github/workflows/neural-nova-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript and neural-network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: node --check app/dist/js/nova-ui.js
      - run: node --check app/dist/js/test-ui.js
      - run: node --check app/dist/js/diagnostic-ui.js
      - run: node --check app/dist/js/mass-learning-ui.js
      - run: node --check app/dist/js/training-background-ui.js
      - run: node app/tests/android-zip-picker.test.cjs
      - name: Check Android signing/foreground-service configuration script syntax
        run: python3 -m py_compile app/scripts/configure_android_ci.py
      - run: node --check app/dist/js/checkpoint-ui.js
      - run: node --check app/dist/js/brain.js
      - run: node --check app/dist/js/transformer.js
      - run: cargo test --all-targets
        working-directory: neural-nova

  windows:
    name: Windows NSIS (experimental)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      # Keep the original preconfigured icons until an explicit icon-source
      # commit exists. After the user checks in the PNG, generate fresh icons
      # for every installer build, including .ico and 512px icon.png.
      - name: Generate Windows icons from Neural Nova artwork
        if: ${{ hashFiles('app/assets/nova-brain-icon.png') != '' }}
        working-directory: app
        run: npm run icons:generate
      - name: Compile Rust tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Build experimental Windows installer
        working-directory: app
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android debug APK (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      # All experimental CI builds share the intentionally public debug key
      # in app/keys/. No repository secrets or user configuration is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # Prefer the requested pinned NDK if already installed. GitHub's
          # Ubuntu image also ships a working newer NDK; reuse it instead of
          # downloading a ~1GB zip every run (one runner supplied a truncated
          # r27 archive: "Error on ZipFile unknown archive"). Only download if
          # NO complete installed NDK can compile for all four ABIs.
          NDK_ROOT="$SDK_ROOT/ndk"
          ndk_ok() {
            local v="$1"
            local bin="$NDK_ROOT/$v/toolchains/llvm/prebuilt/linux-x86_64/bin"
            for triple in aarch64-linux-android24 armv7a-linux-androideabi24 i686-linux-android24 x86_64-linux-android24; do
              test -x "$bin/$triple-clang" || return 1
            done
          }
          SELECTED="$ANDROID_NDK_VERSION"
          if ! ndk_ok "$SELECTED"; then
            SELECTED=""
            for installed in "$NDK_ROOT"/*; do
              test -d "$installed" || continue
              version="$(basename "$installed")"
              if ndk_ok "$version"; then SELECTED="$version"; break; fi
            done
          fi
          if [[ -z "$SELECTED" ]]; then
            SELECTED="$ANDROID_NDK_VERSION"
            for attempt in 1 2 3; do
              rm -rf "$NDK_ROOT/$SELECTED"
              if "$SDKMANAGER" "ndk;$SELECTED" && ndk_ok "$SELECTED"; then
                break
              fi
              echo "::warning::NDK download failed (attempt $attempt/3); retrying"
              sleep 5
            done
            ndk_ok "$SELECTED" || { echo "::error::No valid Android NDK compiler"; exit 1; }
          fi
          echo "Using Android NDK $SELECTED"
          echo "ANDROID_NDK_VERSION=$SELECTED" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        working-directory: app
        run: npm run android:init -- --ci --skip-targets-install
      # Tauri's Android icons must be written AFTER android:init creates its
      # Gradle res/mipmap folders, not just to src-tauri/icons on the host.
      - name: Generate Android launcher icons from Neural Nova artwork
        if: ${{ hashFiles('app/assets/nova-brain-icon.png') != '' }}
        working-directory: app
        run: npm run icons:generate
      - name: Verify Android mipmap launcher resources
        if: ${{ hashFiles('app/assets/nova-brain-icon.png') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          echo 'Neural Nova launcher PNGs generated in the Android Gradle project'
      # Configure the generated Gradle/manifest files BEFORE the first build.
      # This avoids compiling Android twice and accidentally publishing an
      # unsigned or machine-dependent debug signature.
      - name: Configure pinned experimental debug signature and foreground service
        run: python3 app/scripts/configure_android_ci.py
      # The upstream 1.0.1 service assumes optional libapp_core.so exists,
      # even when the app only uses a keepalive. Provide a minimal JNI
      # lifecycle acknowledgement + PARTIAL_WAKE_LOCK adapter (no model).
      - name: Build Android foreground lifecycle adapter (4 ABIs)
        run: python3 app/scripts/build_android_keepalive.py
      - name: Build experimental Android APK
        working-directory: app
        run: npm run android:debug-apk -- --ci
      - name: Verify packaged foreground adapter for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libapp_core.so"
            done
          done
      - name: Verify APK signed by persistent Neural Nova development certificate
        shell: bash
        run: |
          set -euo pipefail
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing.txt"
            cat "$RUNNER_TEMP/apk-signing.txt" | grep -E 'Verified|Signer #1 certificate DN:|Signer #1 certificate SHA-256 digest:'
            grep -Eiq 'Signer #1 certificate SHA-256 digest: 070b1e684da8087d6c30874c16c9be831b7cbce49264d61040ee73ecb5652ade' "$RUNNER_TEMP/apk-signing.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
