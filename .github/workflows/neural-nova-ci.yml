name: Neural Nova - Rust Core Tests
on:
  push:
    branches: [experimental/neural-nova]
    paths:
      - "neural-nova/**"
      - ".github/workflows/neural-nova-ci.yml"
  pull_request:
    branches: [experimental/neural-nova]
    paths:
      - "neural-nova/**"
      - ".github/workflows/neural-nova-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-neural-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test custom neural-network implementation
        working-directory: neural-nova
        run: cargo test --all-targets
      - name: Compile release trainer
        working-directory: neural-nova
        run: cargo build --release --bin train_ascii
      - name: Measure generated answers on held-out cases (diagnostic; no accuracy threshold)
        working-directory: neural-nova
        run: cargo run --release --bin cooperative_eval -- 4
      - name: Compare same-start flat versus multi-objective education (diagnostic)
        working-directory: neural-nova
        run: cargo run --release --bin curriculum_eval -- 1
      - name: Probe novel context/quantity combinations and hemisphere ablations (diagnostic)
        working-directory: neural-nova
        run: cargo run --release --bin curriculum_ab -- 6
