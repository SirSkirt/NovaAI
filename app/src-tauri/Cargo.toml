[package]
name = "nova-local-assistant"
version = "0.9.0"
description = "Neural Nova experimental neural-network trainer"
authors = ["QTech"]
edition = "2021"
default-run = "nova-local-assistant"

[lib]
name = "nova_local_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
# Android SAF content URIs need native dialog/fs APIs rather than WebView File.arrayBuffer.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
neural-nova = { path = "../../neural-nova" }

[features]
default = []
