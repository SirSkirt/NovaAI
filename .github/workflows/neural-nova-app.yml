name: Neural Nova - Experimental App Builds

on:
  push:
    branches:
      - experimental/neural-nova
    paths:
      - "app/**"
      - "neural-nova/**"
      - ".github/workflows/neural-nova-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript and neural-network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: node --check app/dist/js/nova-ui.js
      - run: node --check app/dist/js/test-ui.js
      - run: node --check app/dist/js/diagnostic-ui.js
      - run: node --check app/dist/js/mass-learning-ui.js
      - run: node --check app/dist/js/training-background-ui.js
      - run: node app/tests/android-zip-picker.test.cjs
      - name: Check Android signing/foreground-service configuration script syntax
        run: python3 -m py_compile app/scripts/configure_android_ci.py
      - run: node --check app/dist/js/checkpoint-ui.js
      - run: node --check app/dist/js/brain.js
      - run: node --check app/dist/js/transformer.js
      - run: cargo test --all-targets
        working-directory: neural-nova

  windows:
    name: Windows NSIS (experimental)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compile Rust tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Build experimental Windows installer
        working-directory: app
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android debug APK (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      # All experimental CI builds share the intentionally public debug key
      # in app/keys/. No repository secrets or user configuration is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        working-directory: app
        run: npm run android:init -- --ci --skip-targets-install
      # Configure the generated Gradle/manifest files BEFORE the first build.
      # This avoids compiling Android twice and accidentally publishing an
      # unsigned or machine-dependent debug signature.
      - name: Configure pinned experimental debug signature and foreground service
        run: python3 app/scripts/configure_android_ci.py
      # The upstream 1.0.1 service assumes optional libapp_core.so exists,
      # even when the app only uses a keepalive. Provide a minimal JNI
      # lifecycle acknowledgement + PARTIAL_WAKE_LOCK adapter (no model).
      - name: Build Android foreground lifecycle adapter (4 ABIs)
        run: python3 app/scripts/build_android_keepalive.py
      - name: Build experimental Android APK
        working-directory: app
        run: npm run android:debug-apk -- --ci
      - name: Verify packaged foreground adapter for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libapp_core.so"
            done
          done
      - name: Verify APK signed by persistent Neural Nova development certificate
        shell: bash
        run: |
          set -euo pipefail
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing.txt"
            cat "$RUNNER_TEMP/apk-signing.txt" | grep -E 'Verified|Signer #1 certificate DN:|Signer #1 certificate SHA-256 digest:'
            grep -Eiq 'Signer #1 certificate SHA-256 digest: 070b1e684da8087d6c30874c16c9be831b7cbce49264d61040ee73ecb5652ade' "$RUNNER_TEMP/apk-signing.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
