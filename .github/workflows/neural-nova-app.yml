name: Neural Nova - Experimental App Builds

on:
  push:
    branches:
      - experimental/neural-nova
    paths:
      - "app/**"
      - "neural-nova/**"
      - ".github/workflows/neural-nova-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript and neural-network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: node --check app/dist/js/nova2-main.js
      - run: node --check app/dist/js/nova-messenger-layout.js
      - run: node app/tests/messenger-layout.test.cjs
      - run: node --check app/dist/js/nova2-test-ui.js
      - run: node --check app/dist/js/nova2-education-ui.js
      - run: node --check app/dist/js/training-background-ui.js
      - run: node app/tests/bicameral-integration.test.cjs
      - name: Check Android signing/foreground-service configuration script syntax
        run: python3 -m py_compile app/scripts/configure_android_ci.py
      - run: node --check app/scripts/generate-icons.mjs
      - run: node --check app/scripts/apply-icon.mjs
      - run: cargo test --all-targets
        working-directory: neural-nova

  windows:
    name: Windows NSIS (experimental)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Generate Windows icon set from committed icon.png
        working-directory: app
        run: npm run icons:generate
      - name: Verify generated Windows icons
        shell: pwsh
        run: |
          foreach ($filename in @("icon.ico", "32x32.png", "128x128.png", "128x128@2x.png")) {
            $file = Join-Path "app/src-tauri/icons" $filename
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 128) {
              throw "Tauri failed to generate $file"
            }
          }
      - name: Compile Rust tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Build experimental Windows installer
        working-directory: app
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android debug APK (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      # All experimental CI builds share the intentionally public debug key
      # in app/keys/. No repository secrets or user configuration is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # Prefer the requested pinned NDK if already installed. GitHub's
          # Ubuntu image also ships a working newer NDK; reuse it instead of
          # downloading a ~1GB zip every run (one runner supplied a truncated
          # r27 archive: "Error on ZipFile unknown archive"). Only download if
          # NO complete installed NDK can compile for all four ABIs.
          NDK_ROOT="$SDK_ROOT/ndk"
          ndk_ok() {
            local v="$1"
            local bin="$NDK_ROOT/$v/toolchains/llvm/prebuilt/linux-x86_64/bin"
            for triple in aarch64-linux-android24 armv7a-linux-androideabi24 i686-linux-android24 x86_64-linux-android24; do
              test -x "$bin/$triple-clang" || return 1
            done
          }
          SELECTED="$ANDROID_NDK_VERSION"
          if ! ndk_ok "$SELECTED"; then
            SELECTED=""
            for installed in "$NDK_ROOT"/*; do
              test -d "$installed" || continue
              version="$(basename "$installed")"
              if ndk_ok "$version"; then SELECTED="$version"; break; fi
            done
          fi
          if [[ -z "$SELECTED" ]]; then
            SELECTED="$ANDROID_NDK_VERSION"
            for attempt in 1 2 3; do
              rm -rf "$NDK_ROOT/$SELECTED"
              if "$SDKMANAGER" "ndk;$SELECTED" && ndk_ok "$SELECTED"; then
                break
              fi
              echo "::warning::NDK download failed (attempt $attempt/3); retrying"
              sleep 5
            done
            ndk_ok "$SELECTED" || { echo "::error::No valid Android NDK compiler"; exit 1; }
          fi
          echo "Using Android NDK $SELECTED"
          echo "ANDROID_NDK_VERSION=$SELECTED" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Preserve original icon and generate pre-init icons
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          # The user committed ONLY icon.png. Tauri's init and packaging
          # may need the generated desktop assets before Android init.
          # Keep this original 1254px artwork unchanged for the second pass.
          cp src-tauri/icons/icon.png "$RUNNER_TEMP/nova-original-icon.png"
          NOVA_ICON_SOURCE="$RUNNER_TEMP/nova-original-icon.png" npm run icons:generate
      - name: Initialize Android project
        working-directory: app
        run: npm run android:init -- --ci --skip-targets-install
      # The Android Gradle project now exists. Run Tauri again to generate
      # native mipmap images, including adaptive foreground and round icons.
      - name: Generate Android launcher icons from original brain icon
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          NOVA_ICON_SOURCE="$RUNNER_TEMP/nova-original-icon.png" npm run icons:generate
      - name: Verify Android mipmap launcher resources
        shell: bash
        run: |
          set -euo pipefail
          for filename in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
            test -s "app/src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/$filename"
          done
          test -s app/src-tauri/icons/icon.ico
          echo 'Neural Nova launcher assets generated in desktop and native Android projects'
      # Configure the generated Gradle/manifest files BEFORE the first build.
      # This avoids compiling Android twice and accidentally publishing an
      # unsigned or machine-dependent debug signature.
      - name: Configure pinned experimental debug signature and foreground service
        run: python3 app/scripts/configure_android_ci.py
      # The upstream 1.0.1 service assumes optional libapp_core.so exists,
      # even when the app only uses a keepalive. Provide a minimal JNI
      # lifecycle acknowledgement + PARTIAL_WAKE_LOCK adapter (no model).
      - name: Build Android foreground lifecycle adapter (4 ABIs)
        run: python3 app/scripts/build_android_keepalive.py
      - name: Verify native checkpoint saver registered in generated Android package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=app/src-tauri/gen/android/app/src/main/java/com/qtech/neuralnova/experimental/NovaTrainingContextProvider.java
          test -s "$SOURCE"
          grep -q 'writeVerifiedCheckpoint' "$SOURCE"
          grep -q 'openOutputStream' "$SOURCE"
          grep -q 'openInputStream' "$SOURCE"
      - name: Build experimental Android APK
        working-directory: app
        run: npm run android:debug-apk -- --ci
      - name: Verify packaged foreground adapter for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libapp_core.so"
            done
          done
      - name: Verify APK signed by persistent Neural Nova development certificate
        shell: bash
        run: |
          set -euo pipefail
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing.txt"
            cat "$RUNNER_TEMP/apk-signing.txt" | grep -E 'Verified|Signer #1 certificate DN:|Signer #1 certificate SHA-256 digest:'
            grep -Eiq 'Signer #1 certificate SHA-256 digest: 070b1e684da8087d6c30874c16c9be831b7cbce49264d61040ee73ecb5652ade' "$RUNNER_TEMP/apk-signing.txt"
          done
      # The filename is only a distribution label. Do NOT change the Android
      # application ID, internal app name, versionCode or pinned signing key.
      # Always derive the public APK filename from the Tauri app version.
      - name: Stage Nova-[Version].apk for download
        id: versioned_apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("app/src-tauri/tauri.conf.json").read_text())["version"])')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid app version for APK filename: $VERSION"
            exit 1
          }
          shopt -s globstar nullglob
          APKS=(app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            printf 'Expected one signed universal APK, found %s:\n' "${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          mkdir -p app/packaged-apk
          cp -- "${APKS[0]}" "app/packaged-apk/Nova-${VERSION}.apk"
          cmp -- "${APKS[0]}" "app/packaged-apk/Nova-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "app/packaged-apk/Nova-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published APK: Nova-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-${{ steps.versioned_apk.outputs.version }}
          path: app/packaged-apk/Nova-*.apk
          if-no-files-found: error
          compression-level: 0
