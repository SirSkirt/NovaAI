name: Neural Nova - Experimental App Builds

on:
  push:
    branches:
      - experimental/neural-nova
    paths:
      - "app/**"
      - "neural-nova/**"
      - ".github/workflows/neural-nova-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript and neural-network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: node --check app/dist/js/nova-ui.js
      - run: node --check app/dist/js/brain.js
      - run: node --check app/dist/js/transformer.js
      - run: cargo test --all-targets
        working-directory: neural-nova

  windows:
    name: Windows NSIS (experimental)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compile Rust tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Build experimental Windows installer
        working-directory: app
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android debug APK (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Install Tauri CLI
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        working-directory: app
        run: npm run android:init -- --ci --skip-targets-install
      - name: Build experimental Android APK
        working-directory: app
        run: npm run android:debug-apk -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Nova-Experimental-Android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
