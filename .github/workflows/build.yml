name: Build Nova alpha 9.3.1

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "releases/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: releases/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix.zip
  SOURCE_DIR: .build/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix
  SOURCE_SHA256: 041efe09dfa7dd14732d84bffa02776bd1b5fb041139fa2cdf845f7bc343f028

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: pwsh
        run: |
          $actual = (Get-FileHash -Algorithm SHA256 "${{ env.SOURCE_ZIP }}").Hash.ToLower()
          if ($actual -ne "${{ env.SOURCE_SHA256 }}") {
            throw "Source ZIP SHA-256 mismatch. Expected ${{ env.SOURCE_SHA256 }}, got $actual"
          }

      - name: Extract source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".build" | Out-Null
          Expand-Archive -LiteralPath "${{ env.SOURCE_ZIP }}" -DestinationPath ".build" -Force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SOURCE_DIR }}/src-tauri -> target"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location "${{ env.SOURCE_DIR }}"
          npm install

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location "${{ env.SOURCE_DIR }}"
          npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-NSIS-alpha-9.3.1
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          echo "${SOURCE_SHA256}  ${SOURCE_ZIP}" | sha256sum -c -

      - name: Extract source archive
        shell: bash
        run: |
          mkdir -p .build
          unzip -q "${SOURCE_ZIP}" -d .build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "Could not locate sdkmanager under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SOURCE_DIR }}/src-tauri -> target"

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd "${SOURCE_DIR}"
          npm install

      - name: Initialize Tauri Android project
        shell: bash
        run: |
          cd "${SOURCE_DIR}"
          npm run android:init -- --ci --skip-targets-install

      - name: Build Android debug APK
        shell: bash
        run: |
          cd "${SOURCE_DIR}"
          npm run android:debug-apk -- --ci

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-Debug-APK-alpha-9.3.1
          path: ${{ env.SOURCE_DIR }}/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
