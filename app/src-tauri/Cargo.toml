[package]
name = "nova-local-assistant"
version = "0.3.0"
description = "Neural Nova experimental neural-network trainer"
authors = ["QTech"]
edition = "2021"
default-run = "nova-local-assistant"

[lib]
name = "nova_local_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neural-nova = { path = "../../neural-nova" }

[features]
default = []
