name: Neural Nova - Unpack Legacy Source
on:
  push:
    branches:
      - experimental/neural-nova
    paths:
      - .github/workflows/neural-nova-source.yml
      - "neural-nova/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.ref == 'refs/heads/experimental/neural-nova'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/neural-nova

      - name: Verify original Nova source ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "041efe09dfa7dd14732d84bffa02776bd1b5fb041139fa2cdf845f7bc343f028  releases/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix.zip" | sha256sum -c -

      - name: Expand complete source without touching main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nova-extracted"
          unzip -q releases/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix.zip -d "$RUNNER_TEMP/nova-extracted"
          src="$RUNNER_TEMP/nova-extracted/Nova-Tauri-V7.0.0-alpha.9.3.1-Compile-Fix"
          test -f "$src/package.json"
          test -d "$src/src-tauri"
          mkdir -p app
          cp -a "$src/." app/
          echo "Expanded project file manifest:"
          find app -type f | sort | head -150
          git add -A -f app
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(neural-nova): expand full original Nova source on experimental branch"
          git push origin HEAD:experimental/neural-nova
