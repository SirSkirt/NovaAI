[package]
name = "nova-local-assistant"
version = "0.20.0"
description = "Nova Messenger: local Bicameral neural chat and checkpoint tools"
authors = ["QTech"]
edition = "2021"
default-run = "nova-local-assistant"

[lib]
name = "nova_local_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
# Android SAF content URIs need native dialog/fs APIs rather than WebView File.arrayBuffer.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neural-nova = { path = "../../neural-nova" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = []
